# Snippet to add inside the existing rb-library <VirtualHost> block.
# Self-contained: everything this module needs lives under this project
# folder (venv, code, config). The only action required on the shared vhost
# is a single line inside its <VirtualHost> block:
#
#     Include /path/to/rb-library/backend/apache-vhost-snippet.conf
#
# Requires mod_wsgi enabled once for the whole host (a2enmod wsgi via
# libapache2-mod-wsgi-py3) - a prerequisite shared by any Python-under-Apache
# app, not specific to this module. No other system-wide change is made.
#
# One-time setup, entirely inside the project folder:
#     cd /path/to/rb-library
#     python3 -m venv .venv
#     .venv/bin/pip install -r backend/requirements.txt
#     cp backend/admin-config.example.json backend/admin-config.json
#     # edit backend/admin-config.json: secret_key, filebrowser_enabled/url
#
# To remove this module entirely: delete the project folder and remove the
# single Include line above from the vhost.
# Replace /path/to/rb-library below with the actual path to this project folder.

WSGIDaemonProcess rb-library-admin user=recuser group=recuser processes=1 threads=2 \
    python-home=/path/to/rb-library/.venv \
    display-name=%{GROUP}

WSGIScriptAlias /admin/api /path/to/rb-library/backend/wsgi.py process-group=rb-library-admin application-group=%{GLOBAL}

<Directory /path/to/rb-library/backend>
    WSGIProcessGroup rb-library-admin
    Require all granted
</Directory>

# admin.html itself is served as a plain static file by the existing vhost,
# no extra Alias needed as long as it sits next to index.html.
